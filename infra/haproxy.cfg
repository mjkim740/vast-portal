#---------------------------------------------------------------------
# VAST 고객사 사용현황 포털 - HAProxy 설정
#
#   HAProxy   : 10.20.15.185
#   k8s worker: 10.20.15.124 (k8s-worker01)
#               10.20.15.125 (k8s-worker02)
#   NodePort  : 31080 (http) / 31443 (https) / 31254 (health)
#
# 기존 apiserver 용 HAProxy 가 이 서버에 이미 있다면
# global / defaults 는 기존 것을 쓰고 frontend/backend 블록만 추가할 것.
# (그 경우 defaults 의 mode 가 tcp 일 수 있으므로 아래 mode http 는 필수)
#---------------------------------------------------------------------

global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     4000
    user        haproxy
    group       haproxy
    daemon
    stats socket /var/lib/haproxy/stats mode 660 level admin

defaults
    mode                    http
    log                     global
    option                  httplog
    option                  dontlognull
    option                  http-server-close
    option                  forwardfor except 127.0.0.0/8
    option                  redispatch
    retries                 3
    timeout http-request    10s
    timeout queue           1m
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout http-keep-alive 10s
    timeout check           5s
    maxconn                 3000

#--- 포털 프론트엔드 --------------------------------------------------
frontend vast_portal_in
    bind 10.20.15.185:80
    mode http
    option httplog

    # 접근 대역 제한은 현재 두지 않는다.
    # 인증이 없는 시스템이므로, 이 서버가 사내망 밖에서도 닿는 위치라면
    # acl 로 제한하거나 Ingress 에 basic auth 를 거는 편이 안전하다.
    #   acl internal src 10.20.0.0/16
    #   http-request deny unless internal

    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port  %[dst_port]

    default_backend vast_portal_be

backend vast_portal_be
    mode http
    balance roundrobin
    option forwardfor

    # ingress-nginx 컨트롤러의 /healthz.
    # 30080 으로 체크하면 매칭 Ingress 가 없어 404 가 나므로
    # 반드시 별도 노출한 30254(=컨테이너 10254) 로 확인한다.
    option httpchk GET /healthz
    http-check expect status 200

    # externalTrafficPolicy=Local 이므로 ingress 파드가 없는 노드는
    # 연결을 거부한다. HAProxy 가 자동으로 down 처리하므로 정상 동작.
    # ingress 파드가 없는 노드는 externalTrafficPolicy=Local 때문에 응답하지 않는다.
    # 전 노드를 등록해두면 파드가 어디로 옮겨가도 HAProxy 가 알아서 살아 있는 쪽으로 보낸다.
    # 파드 없는 노드가 DOWN 으로 보이는 것은 정상이다.
    server k8s-master01 10.20.15.121:31080 check port 31254 inter 5s fall 3 rise 2
    server k8s-master02 10.20.15.122:31080 check port 31254 inter 5s fall 3 rise 2
    server k8s-master03 10.20.15.123:31080 check port 31254 inter 5s fall 3 rise 2
    server k8s-worker01 10.20.15.124:31080 check port 31254 inter 5s fall 3 rise 2
    server k8s-worker02 10.20.15.125:31080 check port 31254 inter 5s fall 3 rise 2

#--- 상태 페이지 ------------------------------------------------------
listen stats
    bind 10.20.15.185:9000
    mode http
    stats enable
    stats uri /haproxy
    stats refresh 10s
    stats show-node
    stats admin if TRUE
