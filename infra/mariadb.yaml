apiVersion: v1
kind: Namespace
metadata:
  name: vast-portal
---
# MariaDB 서버 설정
# utf8mb4 는 고객사명이 한글이라 필수.
#
# 아래 innodb_flush_method 주석을 보라 — 이 볼륨은 NFS(csi.vastdata.com)다.
# 예전 주석에 'vastblock(NVMe-oF) 위에서 O_DIRECT 로 동작' 이라고 적혀 있었는데
# 실제 설정과 어긋나 있었다. 설정이 맞고 주석이 틀렸던 것이라 주석을 고쳤다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-config
  namespace: vast-portal
data:
  my.cnf: |
    [mysqld]
    character-set-server = utf8mb4
    collation-server     = utf8mb4_unicode_ci
    skip-character-set-client-handshake

    default-time-zone    = '+09:00'
    max_connections      = 200

    # MariaDB 11.x 는 utf8mb4 의 기본 collation 이 uca1400_ai_ci 다.
    # 테이블은 unicode_ci 인데 쿼리 리터럴이 uca1400_ai_ci 로 해석되어
    # "Illegal mix of collations" 가 난다. 리터럴 쪽을 맞춰준다.
    character_set_collations = utf8mb4=utf8mb4_unicode_ci

    innodb_buffer_pool_size = 1G
    # NFS(vastdata-delete) 위에서 돌므로 O_DIRECT 대신 fsync 를 쓴다.
    # 블록 스토리지로 옮기면 O_DIRECT 로 되돌려도 된다.
    innodb_flush_method     = fsync
    innodb_use_native_aio   = 0
    innodb_flush_log_at_trx_commit = 1
    innodb_file_per_table   = 1

    slow_query_log       = 1
    slow_query_log_file  = /var/log/mysql/slow.log
    long_query_time      = 2

    [client]
    default-character-set = utf8mb4
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: vast-portal
spec:
  # StatefulSet 의 안정적 DNS 이름을 위한 헤드리스 서비스.
  # portal-api 는 mariadb-0.mariadb.vast-portal.svc 로 접속.
  clusterIP: None
  selector:
    app: mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: vast-portal
spec:
  serviceName: mariadb
  replicas: 1          # RWO 블록 볼륨이라 단일 인스턴스
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      securityContext:
        fsGroup: 999          # mysql 그룹
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: root-password
            - name: MARIADB_DATABASE
              value: vast_portal
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: username
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: config
              mountPath: /etc/mysql/conf.d
          # /docker-entrypoint-initdb.d 마운트를 제거했다.
          #
          # 왜 뺐나
          #   빈 볼륨으로 처음 뜰 때 ConfigMap(mariadb-initdb)의 schema_v4.sql 이
          #   적재되게 해뒀다. 그런데 그 스키마가 db/schema.sql + migrations 보다
          #   낡아서, 2026-10 스토리지 교체 복구 때 사고가 났다.
          #
          #   덤프를 복원하려는 DB 에 옛 스키마가 먼저 깔려 있었고, 옛 테이블의
          #   외래키 제약 이름이 덤프의 것과 겹쳐 CREATE TABLE 이 errno 121
          #   (Duplicate key on write or update) 로 실패했다. 제약 이름은
          #   데이터베이스 안에서 전역으로 유일해야 한다.
          #
          #   복구 경로는 '빈 DB + 덤프 복원' 이다. 자동으로 깔리는 스키마는
          #   거기에 도움이 되지 않고 방해가 된다. 새로 구축할 때는
          #   db/schema.sql 과 db/migrations/*.sql 을 순서대로 적용한다.
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: mariadb-config
            optional: true
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: vastdata-delete   # kubectl get sc 로 확인
        resources:
          requests:
            storage: 20Gi
